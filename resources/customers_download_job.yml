resources:
  jobs:
    customers_download_job:
      name: customers_download_job
      max_concurrent_runs: 1
      tasks:
        - task_key: download_customers_zip
          environment_key: default   # Free Edition chỉ có serverless
          spark_python_task:
            python_file: ../src/learner/customers_download.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${resources.schemas.app_schema.name}   # dev: dev_hieuphso_demo, prod: demo_prod
              - --volume
              - raw
              - --url
              - "https://drive.google.com/uc?id=1yyL20BNKv3PxJRJVjJ_2Q-HidvIUis45&export=download"
              - --file-name
              - customers-100.zip
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
