resources:
  jobs:
    hello_job:                       # key: tên dùng trong lệnh `bundle run hello_job`
      name: hello_job                # tên hiển thị trên UI (dev sẽ thành "[dev hieuphso] hello_job")
      max_concurrent_runs: 1
      tasks:
        - task_key: say_hello
          environment_key: default   # Free Edition chỉ có serverless
          spark_python_task:
            python_file: ../src/learner/hello.py   # đường dẫn tính từ thư mục resources/
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
